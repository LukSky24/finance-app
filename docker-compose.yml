version: "3.9"

services:
    php:
        build:
            context: .
            dockerfile: .docker/php/Dockerfile
            args:
                PUID: ${PUID:-1000}
                PGID: ${PGID:-1000}
        container_name: finance_app_php
        working_dir: /var/www/html
        volumes:
            - ./:/var/www/html:cached
            - composer_cache:/tmp/composer
        environment:
            APP_ENV: dev
            XDEBUG_MODE: off
        depends_on:
            - db

    nginx:
        image: nginx:1.25-alpine
        container_name: finance_app_nginx
        ports:
            - "8080:80"
        volumes:
            - ./:/var/www/html:cached
            - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - php

    db:
        image: postgres:15-alpine
        container_name: finance_app_db
        environment:
            POSTGRES_USER: symfony
            POSTGRES_PASSWORD: symfony
            POSTGRES_DB: finance
        ports:
            - "5432:5432"
        volumes:
            - db_data:/var/lib/postgresql/data

volumes:
    composer_cache:
    db_data: